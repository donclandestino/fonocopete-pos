*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#0f172a;color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:22px;font-weight:800;color:var(--orange2);line-height:1.15}.sub{font-size:12px;color:#cbd5e1;margin:8px 0 16px}
.menu button{display:block;width:100%;margin:8px 0;padding:10px 12px;border:none;border-radius:12px;background:#1e293b;color:#fff;text-align:left;cursor:pointer}.menu button.active,.menu button:hover{background:var(--orange);color:#111827;font-weight:700}
.main{padding:18px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{font-size:28px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 390px;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab{padding:10px 14px;border:1px solid var(--border);background:#fff;border-radius:999px;cursor:pointer;white-space:nowrap}.tab.active{background:var(--orange);border-color:var(--orange);font-weight:700}
.prod{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;min-height:100px}.prod:hover{border-color:var(--orange)}.prod .price{color:#f97316;font-weight:800;font-size:18px}
.muted{color:var(--muted)}.orange{color:var(--orange)}.red{color:var(--red)}.green{color:var(--green)}.bold{font-weight:700}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:12px;margin:4px 4px 0 0}.item{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:12px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--border)}.table tr.total{border-top:2px solid #111;font-weight:800}.list{max-height:520px;overflow:auto}
.danger-card{border:2px solid #ef4444}.success-card{border:2px solid #22c55e}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:white;padding:12px 16px;border-radius:12px;z-index:50;opacity:0;transition:.25s}.toast.show{opacity:1}

function normProductName(v){
  return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(lt|lts|litro|litros)\b/g,'').replace(/[^a-z0-9]+/g,' ').trim();
}
function fixTextEncoding(v){
  if(typeof v!=='string')return v;
  const reps=[
    ['\u00c2\u00b7','·'],['\u00c2\u00bf','¿'],['\u00c2\u00a1','¡'],
    ['\u00c3\u00a1','á'],['\u00c3\u00a9','é'],['\u00c3\u00ad','í'],['\u00c3\u00b3','ó'],['\u00c3\u00ba','ú'],['\u00c3\u00b1','ñ'],['\u00c3\u00bc','ü'],
    ['\u00c3\u0081','Á'],['\u00c3\u0089','É'],['\u00c3\u008d','Í'],['\u00c3\u0093','Ó'],['\u00c3\u009a','Ú'],['\u00c3\u0091','Ñ'],
    ['\u00e2\u2020\u0090','←'],['\u00e2\u2020\u2019','→'],['\u00e2\u0161\u00a0','⚠'],
    ['Contrase?a','Contraseña'],['Due?o','Dueño'],['due?o','dueño'],['d?a','día'],['D?a','Día'],
    ['r?pida','rápida'],['C?cteles','Cócteles'],['Pi?a','Piña'],['Concepci?n','Concepción'],
    ['?ngeles','Ángeles'],['Chill?n','Chillán'],['Nicol?s','Nicolás'],['L?pez','López'],['Guzm?n','Guzmán'],
    ['carg?','cargó'],['cr?tico','crítico'],['m?nimo','mínimo'],['M?nimo','Mínimo'],['m?n','mín'],
    ['m?s','más'],['Atr?s','Atrás'],['autom?tico','automático'],['a?n','aún'],['edici?n','edición'],
    ['encontr?','encontró'],['activ?','activó'],['versi?n','versión'],['categor?a','categoría'],
    ['Categor?a','Categoría'],['Energ?ticas','Energéticas'],['Acci?n','Acción']
  ];
  let out=v;
  reps.forEach(([bad,good])=>{out=out.split(bad).join(good)});
  return out;
}
function repairTextEncodingDeep(v){
  if(typeof v==='string')return fixTextEncoding(v);
  if(Array.isArray(v))return v.map(repairTextEncodingDeep);
  if(v&&typeof v==='object'){
    Object.keys(v).forEach(k=>{v[k]=repairTextEncodingDeep(v[k])});
  }
  return v;
}
function repairStateTextEncoding(){
  ['users','branches','categories','products','couriers','sales','invoices','closures','courierMovements'].forEach(k=>repairTextEncodingDeep(state[k]));
}
function ensureBaseProductsPresent(){
  state.products=(state.products||[]).filter(p=>!LEGACY_DUPLICATE_PRODUCT_IDS.has(p.id));
  const existing=new Set((state.products||[]).map(p=>p.id));
  const existingNames=new Set((state.products||[]).map(p=>normProductName(p.name)));
  normalizeProducts(BASE_PRODUCTS).forEach(p=>{
    const nameKey=normProductName(p.name);
    if(!existing.has(p.id)&&!existingNames.has(nameKey)){
      state.products.push(p);
      existing.add(p.id);
      existingNames.add(nameKey);
    }
  });
}
function seedInventory(){
  const index=new Set(state.inventory.map(r=>r.branchId+'|'+r.productId));
  state.branches.forEach(b=>{
    state.products.filter(p=>p.type==='simple'&&p.trackStock!==false).forEach(p=>{
      const key=b.id+'|'+p.id;
      if(!index.has(key)) state.inventory.push({branchId:b.id,productId:p.id,stock:0,cost:0,min:0});
    });
  });
}

async function waitFirebaseReady(){
  if(window.FONO_FIREBASE && window.FONO_FIREBASE.ready) return true;
  return new Promise(resolve=>{
    let done=false;
    const finish=(v)=>{if(!done){done=true;resolve(v)}};
    window.addEventListener('fonoFirebaseReady',()=>finish(true),{once:true});
    setTimeout(()=>finish(false),3000);
  });
}

const cloudLoadedScopes=new Set();
function cloudFilterKey(name,filters=[]){
  return `${name}|${filters.map(f=>f.join(':')).join('|')||'all'}`;
}
function cloudBranchFilters(bid=branchId()){
  return bid&&bid!=='all'?[['branchId','==',bid]]:[];

async function cloudQueryRows(name,filters=[]){
  if(!canUseFirebase()) return [];
  const f=window.FONO_FIREBASE;
  if(filters.length&&(!f.query||!f.where)){
    return cloudLoadCollection(name);
  }
  const base=f.collection(f.db,name);
  const ref=filters.length?f.query(base,...filters.map(([field,op,value])=>f.where(field,op,value))):base;
  const snap=await f.getDocs(ref);
  const rows=[];
  snap.forEach(d=>rows.push(d.data()));
  return rows;
}
async function cloudLoadCollectionFiltered(name,filters=[],scopeKey=''){
  const key=scopeKey||cloudFilterKey(name,filters);
  if(key&&cloudLoadedScopes.has(key)) return null;
  const rows=await cloudQueryRows(name,filters);
  if(key)cloudLoadedScopes.add(key);
  return rows;
}
function replaceRowsForBranch(key,rows,bid=branchId()){
  const incoming=Array.isArray(rows)?rows:[];
  if(bid&&bid!=='all'){

  }else{

  }

async function cloudLoadDayData(date=state.activeDate,bid=branchId()){
  if(!canUseFirebase()) return;
  const filters=[...cloudBranchFilters(bid),['date','==',date]];
  const scope=`day|${bid||'all'}|${date}`;
  if(cloudLoadedScopes.has(`history|${bid||'all'}`)) return;
  if(cloudLoadedScopes.has(scope)) return;
  const [sales,closures,courierMovements]=await Promise.all([
    cloudLoadCollectionFiltered('sales',filters,`${scope}|sales`),
    cloudLoadCollectionFiltered('closures',filters,`${scope}|closures`),
    cloudLoadCollectionFiltered('courierMovements',filters,`${scope}|courierMovements`)
  ]);
  if(Array.isArray(sales))replaceRowsForBranchDate('sales',sales,bid,date);
  if(Array.isArray(closures))replaceRowsForBranchDate('closures',closures,bid,date);
  if(Array.isArray(courierMovements))replaceRowsForBranchDate('courierMovements',courierMovements,bid,date);
  cloudLoadedScopes.add(scope);

  const f=window.FONO_FIREBASE;
  await f.setDoc(f.doc(f.db,'monthlyExpenses',row.id),{
    ...row,
    updatedAt:f.serverTimestamp()
  });
}
async function cloudSaveCourierMovement(row){
  if(!canUseFirebase() || !row) return;
  const f=window.FONO_FIREBASE;
  await f.setDoc(f.doc(f.db,'courierMovements',row.id),{
    ...row,
    updatedAt:f.serverTimestamp()
  });
}
async function cloudLoadCollection(name){
  if(!canUseFirebase()) return [];
  const f=window.FONO_FIREBASE;
  const snap=await f.getDocs(f.collection(f.db,name));
  const rows=[];
  snap.forEach(d=>rows.push(d.data()));
  return rows;
}

    state.activeDate=todayDMY();
    state.selectedHistoryDate=state.activeDate;
    state.selectedCourierDate=state.activeDate;
    state.selectedMonth=monthKey(state.activeDate);

    state.courierMovements=[];

    state.editInvoiceId=null;

    state.paymentMode='efectivo';

    state.mixTr=0;

    seedInventory();

      cloudLoadCollection('sales'),
      cloudLoadCollection('invoices'),
      cloudLoadCollection('closures'),

      cloudLoadCollection('monthlyExpenses'),
      cloudLoadCollection('courierMovements')
    ]);

    state.invoices=Array.isArray(invoices)?invoices:[];
    state.closures=Array.isArray(closures)?closures:[];
    state.capitalResets=Array.isArray(capitalResets)?capitalResets:[];

    seedInventory();
    saveLocal();
    toast('Datos cargados desde Firebase');
  }catch(e){
    console.error('Error cargando Firebase',e);
    toast('Error Firebase. Usando respaldo local.');
  }
}
async function cloudBackupAll(){
  if(!canUseFirebase()) return;
  try{
    await cloudSaveConfig();
    await cloudSaveAllInventory();
    await Promise.all([
      ...(state.sales||[]).map(s=>cloudSaveSale(s)),
      ...(state.invoices||[]).map(i=>cloudSaveInvoice(i)),
      ...(state.closures||[]).map(c=>cloudSaveClosure(c)),
      ...(state.capitalResets||[]).map(r=>cloudSaveCapitalReset(r)),
      ...(state.monthlyExpenses||[]).map(r=>cloudSaveMonthlyExpense(r)),
      ...(state.courierMovements||[]).map(r=>cloudSaveCourierMovement(r))
    ]);
  }catch(e){
    console.error('Error backup Firebase',e);
  }
}

function loadLocal(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const saved=JSON.parse(raw);
      Object.assign(state,saved);
      state.currentUser=null;
      state.products=normalizeProducts(state.products&&state.products.length?state.products:BASE_PRODUCTS);
      state.users=state.users&&state.users.length?state.users:BASE_USERS;
      state.branches=state.branches&&state.branches.length?state.branches:BRANCHES;
    }catch(e){console.error(e)}
  }
  if(!Array.isArray(state.sales))state.sales=[];
  if(!Array.isArray(state.invoices))state.invoices=[];
  if(!Array.isArray(state.closures))state.closures=[];
  if(!Array.isArray(state.capitalResets))state.capitalResets=[];
  if(!Array.isArray(state.monthlyExpenses))state.monthlyExpenses=[];
  if(!Array.isArray(state.courierMovements))state.courierMovements=[];
  if(!Array.isArray(state.inventory))state.inventory=[];
  if(!state.branchTemp) state.branchTemp={};
  repairStateTextEncoding();
  ensureBaseProductsPresent();
  state.activeDate=todayDMY();
  state.selectedHistoryDate=state.activeDate;
  state.selectedCourierDate=state.activeDate;
  state.selectedMonth=monthKey(state.activeDate);
  seedInventory();
}
function pendingLocalSale(s){return !!(s&&s.syncStatus&&s.syncStatus!=='synced')}
function sameLocalMonth(date,mk){return monthKey(date||todayDMY())===mk}
function compactLocalRows(rows,keepDates,keepMonths,opts={}){
  return (Array.isArray(rows)?rows:[]).filter(r=>{
    if(opts.keepPending&&pendingLocalSale(r))return true;
    if(r&&r.syncStatus&&r.syncStatus!=='synced')return true;
    if(r&&r.localOnly)return true;
    if(r&&r.date&&keepDates.has(r.date))return true;
    if(r&&r.date&&keepMonths.has(monthKey(r.date)))return true;
    return false;
  });
}

  const keepMonths=new Set([selectedMonth,monthKey(activeDate),monthKey(today)].filter(Boolean));
  const compact={

    invQuery:src.invQuery||'',
    facCategory:src.facCategory||'Piscos',
    facQuery:src.facQuery||'',
    prodCategory:src.prodCategory||'Piscos',
    prodQuery:src.prodQuery||'',
    controlRepCategory:src.controlRepCategory||'Piscos',
    controlRepQuery:src.controlRepQuery||'',
    controlRepCourierId:src.controlRepCourierId||'',
    selectedLibroCourierId:src.selectedLibroCourierId||'',
    cart:Array.isArray(src.cart)?src.cart:[],
    editSaleId:src.editSaleId||null,
    invoiceDraft:Array.isArray(src.invoiceDraft)?src.invoiceDraft:[],
    editInvoiceId:src.editInvoiceId||null,
    invoiceType:src.invoiceType||'reposicion',
    paymentMode:src.paymentMode||'efectivo',
    mixEf:Number(src.mixEf||0),
    mixTr:Number(src.mixTr||0),
    mixTb:Number(src.mixTb||0),
    selectedCourierId:src.selectedCourierId||'',
    fuelExpense:src.fuelExpense||'',
    branchTemp:src.branchTemp||{},
    branches:Array.isArray(src.branches)&&src.branches.length?src.branches:BRANCHES,
    users:Array.isArray(src.users)&&src.users.length?src.users:BASE_USERS,
    categories:Array.isArray(src.categories)&&src.categories.length?src.categories:BASE_CATEGORIES,
    products:normalizeProducts(Array.isArray(src.products)&&src.products.length?src.products:BASE_PRODUCTS),
    couriers:Array.isArray(src.couriers)?src.couriers:[],
    inventory:Array.isArray(src.inventory)?src.inventory:[],
    sales:compactLocalRows(src.sales,keepDates,new Set(),{keepPending:true}),
    invoices:compactLocalRows(src.invoices,keepDates,keepMonths),
    closures:compactLocalRows(src.closures,keepDates,keepMonths),
    capitalResets:Array.isArray(src.capitalResets)?src.capitalResets:[],
    monthlyExpenses:(Array.isArray(src.monthlyExpenses)?src.monthlyExpenses:[]).filter(r=>!r.month||keepMonths.has(r.month)),
    courierMovements:compactLocalRows(src.courierMovements,keepDates,new Set())
  };
  return compact;
}
function emergencyLocalState(){
  const activeDate=state.activeDate||todayDMY();
  const keepDates=new Set([activeDate,todayDMY()].filter(Boolean));
  return {
    ...compactLocalState({
      ...state,
      sales:(state.sales||[]).filter(s=>pendingLocalSale(s)||keepDates.has(s.date)),
      invoices:(state.invoices||[]).filter(i=>keepDates.has(i.date)),
      closures:(state.closures||[]).filter(c=>keepDates.has(c.date)),
      monthlyExpenses:[],
      courierMovements:(state.courierMovements||[]).filter(m=>keepDates.has(m.date)),
      capitalResets:[]
    })
  };
}
function pruneLegacyLocalStorage(){
  const keys=new Set(LOCAL_STORAGE_LEGACY_KEYS||[]);
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&(LOCAL_STORAGE_LEGACY_PREFIXES||[]).some(prefix=>k.startsWith(prefix)))keys.add(k);
    }
  }catch(e){
    console.warn('No se pudo revisar cache local antigua',e);
  }
  keys.forEach(k=>{
    if(k&&k!==STORAGE_KEY){
      try{localStorage.removeItem(k)}catch(e){console.warn('No se pudo limpiar cache local antigua',k,e)}
    }
  });
}
function saveLocal(){
  try{
    pruneLegacyLocalStorage();
    const compactJson=JSON.stringify(compactLocalState(state));
    localStorage.setItem(STORAGE_KEY,compactJson);
    return true;
  }catch(e){
    console.error('localStorage lleno. Guardando respaldo minimo.',e);
    try{
      pruneLegacyLocalStorage();
      const emergencyJson=JSON.stringify(emergencyLocalState());
      localStorage.setItem(STORAGE_KEY,emergencyJson);
      toast('Respaldo local reducido por espacio. Firebase sigue como fuente principal.');
      return true;
    }catch(e2){
      console.error('No se pudo guardar respaldo local minimo.',e2);
      toast('Sin espacio para respaldo local. Firebase sigue guardando.');
      return false;
    }
  }
}

function uid(){return Math.random().toString(36).slice(2,10)}
function clp(n){return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(n||0))}
function todayDMY(){return fmtDMY(new Date())}
function fmtDMY(d){return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`}
function parseDMY(s){const [d,m,y]=String(s||todayDMY()).split('-').map(Number);return new Date(y,(m||1)-1,d||1)}
function monthKey(s){const p=String(s||todayDMY()).split('-');return `${p[1]}-${p[2]}`}
function nowTime(){return new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000)}
function shiftDate(s,delta){const d=parseDMY(s);d.setDate(d.getDate()+delta);return fmtDMY(d)}
function shiftMonth(mk,delta){let [m,y]=String(mk).split('-').map(Number);m+=delta;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return `${String(m).padStart(2,'0')}-${y}`}

function product(id){return state.products.find(p=>p.id===id)}
function productBaseOrder(id){const idx=BASE_PRODUCTS.findIndex(p=>p.id===id);return idx>=0?idx:9999}
function productOperationalGroup(p){
  const cat=String(p?.category||''),name=normProductName(p?.name);
  if(cat==='Bebidas'){
    const size=beverageDrinkSize(p);
    if(size==='1.5')return 1;
    if(size==='3')return 2;
    return 3;
  }
  if(cat==='Piscos')return 4;
  if(cat==='Whisky')return 5;
  if(cat==='Otros licores')return 6;
  if(cat==='Cervezas')return 7;
  if(cat==='Vinos')return 8;
  if(cat==='Cócteles'||cat==='Cocteles')return 9;
  if(cat==='Cigarros')return 10;
  if(cat==='Extras')return 11;
  if(cat==='Reparto')return 12;
  return name.includes('redbull')||name.includes('red bull')||name.includes('gatorade')||name.includes('jugo')||name.includes('agua')?3:13;
}
function sortProductsOperational(products){
  return [...(products||[])].sort((a,b)=>
    productOperationalGroup(a)-productOperationalGroup(b)||
    productBaseOrder(a.id)-productBaseOrder(b.id)||
    String(a.name||'').localeCompare(String(b.name||''),'es')
  );
}
function sortInventoryRowsOperational(rows){
  return [...(rows||[])].sort((a,b)=>{
    const pa=product(a.productId),pb=product(b.productId);
    return productOperationalGroup(pa)-productOperationalGroup(pb)||
      productBaseOrder(a.productId)-productBaseOrder(b.productId)||
      String(pa?.name||a.productId).localeCompare(String(pb?.name||b.productId),'es');
  });
}
function sortProductIdRowsOperational(rows,key='productId'){
  return [...(rows||[])].sort((a,b)=>{
    const aid=a?.[key],bid=b?.[key],pa=product(aid),pb=product(bid);
    return productOperationalGroup(pa)-productOperationalGroup(pb)||
      productBaseOrder(aid)-productBaseOrder(bid)||
      String(pa?.name||aid||'').localeCompare(String(pb?.name||bid||''),'es');
  });
}
function inventoryRow(pid,bid=branchId()){return state.inventory.find(r=>r.branchId===bid&&r.productId===pid)}
function getCost(pid,bid=branchId()){return Number((inventoryRow(pid,bid)||{}).cost||0)}
function couriers(){return state.couriers.filter(c=>c.active&&c.branchId===branchId())}
function branchSales(bid=branchId()){return bid==='all'?state.sales.slice():state.sales.filter(s=>s.branchId===bid)}
function daySales(date=state.activeDate,bid=branchId()){return branchSales(bid).filter(s=>s.date===date)}
function monthSales(mk=state.selectedMonth,bid=branchId()){return branchSales(bid).filter(s=>monthKey(s.date)===mk)}
function monthInvoices(mk=state.selectedMonth,bid=branchId()){return state.invoices.filter(i=>(bid==='all'||i.branchId===bid)&&monthKey(i.date)===mk)}
function monthClosures(mk=state.selectedMonth,bid=branchId()){return state.closures.filter(c=>(bid==='all'||c.branchId===bid)&&monthKey(c.date)===mk)}
function monthlyExpenseId(mk=state.selectedMonth,bid=branchId()){return `${bid}_${mk}`}
function emptyMonthlyExpense(mk=state.selectedMonth,bid=branchId()){
  return {id:monthlyExpenseId(mk,bid),branchId:bid,month:mk,iva:0,salaries:[0,0,0,0,0],misc:[0,0],updatedAtLocal:0};
}
function monthlyExpenseRow(mk=state.selectedMonth,bid=branchId()){
  if(bid==='all'){
    const rows=state.monthlyExpenses.filter(r=>r.month===mk);
    return rows.reduce((a,r)=>{
      a.iva+=Number(r.iva||0);
      (r.salaries||[]).forEach((v,i)=>a.salaries[i]=(a.salaries[i]||0)+Number(v||0));
      (r.misc||[]).forEach((v,i)=>a.misc[i]=(a.misc[i]||0)+Number(v||0));
      return a;
    },emptyMonthlyExpense(mk,bid));
  }
  let row=state.monthlyExpenses.find(r=>r.id===monthlyExpenseId(mk,bid));
  if(!row){
    row=emptyMonthlyExpense(mk,bid);
    state.monthlyExpenses.push(row);
  }
  if(!Array.isArray(row.salaries))row.salaries=[0,0,0,0,0];
  if(!Array.isArray(row.misc))row.misc=[0,0];
  return row;
}
function monthlyExpenseTotal(row){return Number(row.iva||0)+(row.salaries||[]).reduce((a,v)=>a+Number(v||0),0)+(row.misc||[]).reduce((a,v)=>a+Number(v||0),0)}
function inventoryValue(bid=branchId()){return state.inventory.filter(r=>bid==='all'||r.branchId===bid).reduce((a,r)=>a+Number(r.stock||0)*Number(r.cost||0),0)}
function periodPayments(list){return list.reduce((a,s)=>{a.efectivo+=Number(s.payments?.efectivo||0);a.transferencia+=Number(s.payments?.transferencia||0);a.transbank+=Number(s.payments?.transbank||0);return a},{efectivo:0,transferencia:0,transbank:0})}
function paymentText(s){const p=s.payments||{},parts=[];if(Number(p.efectivo||0)>0)parts.push(`Efectivo ${clp(p.efectivo)}`);if(Number(p.transferencia||0)>0)parts.push(`Transferencia ${clp(p.transferencia)}`);if(Number(p.transbank||0)>0)parts.push(`Transbank ${clp(p.transbank)}`);return parts.join(' · ')||String(s.paymentMode||'Sin pago')}
function saleCost(s){return (s.items||[]).reduce((sum,item)=>sum+(item.components||[]).reduce((a,c)=>a+Number(c.costAtSale||0)*Number(c.qty||0),0)*Number(item.qty||1),0)}
function saleProfit(s){return Number(s.total||0)-saleCost(s)}
function summary(list){return list.reduce((a,s)=>{a.sales+=Number(s.total||0);a.cost+=saleCost(s);a.profit+=saleProfit(s);a.orders++;a.ef+=Number(s.payments?.efectivo||0);a.tr+=Number(s.payments?.transferencia||0);a.tb+=Number(s.payments?.transbank||0);return a},{sales:0,cost:0,profit:0,orders:0,ef:0,tr:0,tb:0})}
function invoiceTypeValue(v){return v==='capitalInicial'?'capitalInicial':'reposicion'}
function invoiceTypeLabel(v){return invoiceTypeValue(v)==='capitalInicial'?'Capital inicial':'Reposicion'}
function lastCapitalReset(bid=branchId()){
  return (state.capitalResets||[]).filter(r=>r.branchId===bid).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0))[0]||null;
}
function afterCapitalReset(rows,bid=branchId()){
  if(bid==='all'){
    return (rows||[]).filter(r=>Number(r.createdAt||0)>Number(lastCapitalReset(r.branchId)?.createdAt||0));
  }
  const reset=lastCapitalReset(bid);
  const cutoff=Number(reset?.createdAt||0);
  if(!cutoff)return rows||[];
  return (rows||[]).filter(r=>Number(r.createdAt||0)>cutoff);
}
function branchResetCutoff(bid=branchId()){
  return Number(lastCapitalReset(bid)?.createdAt||0);
}
function rowAfterBranchReset(row,bid=branchId()){
  const cutoff=branchResetCutoff(bid);
  return !cutoff||Number(row?.createdAt||0)>cutoff;
}
function capitalInvoicesForMonth(mk=state.selectedMonth,bid=branchId()){
  return afterCapitalReset(monthInvoices(mk,bid),bid);
}
function invoiceSelectableProduct(p){return p&&p.type==='simple'&&p.trackStock!==false}
function selectInvoiceProduct(pid){
  const p=product(pid);
  if(!p)return;
  if(!invoiceSelectableProduct(p))return alert('Este producto es una promo/combo. Para facturar stock ingresa sus componentes reales: producto base, bebida y hielo.');
  const el=document.getElementById('facProd');
  if(el)el.value=pid;
}
function replenishmentInvoices(mk=state.selectedMonth,bid=branchId()){return capitalInvoicesForMonth(mk,bid).filter(i=>invoiceTypeValue(i.type)==='reposicion')}
function expectedCashForMonth(mk=state.selectedMonth,bid=branchId()){const list=monthSales(mk,bid),pay=periodPayments(list),inv=monthInvoices(mk,bid).reduce((a,i)=>a+Number(i.total||0),0),fuel=monthClosures(mk,bid).reduce((a,c)=>a+Number(c.fuelExpense||0),0);return Math.max(0,pay.efectivo+pay.transferencia+pay.transbank-inv-fuel)}
function pendingCapitalForMonth(mk=state.selectedMonth,bid=branchId()){const cost=afterCapitalReset(monthSales(mk,bid),bid).reduce((a,s)=>a+saleCost(s),0),inv=capitalInvoicesForMonth(mk,bid).reduce((a,i)=>a+Number(i.total||0),0);return Math.max(0,cost-inv)}
function costMoneyInCaja(mk=state.selectedMonth,bid=branchId()){
  const soldCost=afterCapitalReset(monthSales(mk,bid),bid).reduce((a,s)=>a+saleCost(s),0);
  const replenishmentCost=replenishmentInvoices(mk,bid).reduce((a,i)=>a+Number(i.total||0),0);
  return Math.max(0,soldCost-replenishmentCost);
}
function controlledCapitalTotal(mk=state.selectedMonth,bid=branchId()){
  return inventoryValue(bid) + costMoneyInCaja(mk,bid);
}
function percent(n,t){return t?Math.round(Number(n||0)/Number(t||0)*100):0}

async function login(){
  const sel=document.getElementById('loginUser');
  const id=sel.value,pass=document.getElementById('loginPass').value.trim();
  try{
    const ok=await waitFirebaseReady();
    if(ok){
      await cloudLoadConfig();
      saveLocal();
      initLogin();
      document.getElementById('loginUser').value=id;
    }
  }catch(e){
    console.error('No se pudo actualizar usuarios antes del login',e);
  }
  const u=state.users.find(x=>x.id===id);
  if(!u)return alert('Selecciona usuario');

function rowVisualTime(row){
  if(Number(row?.createdAt)>0)return Number(row.createdAt);
  const d=parseDMY(row?.date||state.activeDate);
  const m=String(row?.time||'').match(/(\d{1,2}):(\d{2})/);
  if(m)d.setHours(Number(m[1]||0),Number(m[2]||0),0,0);
  return d.getTime()||0;
}
function sortRowsNewest(rows){
  return (rows||[]).slice().sort((a,b)=>rowVisualTime(b)-rowVisualTime(a)||String(b.id||'').localeCompare(String(a.id||'')));
}
function dashboardCustomStart(){return state.dashboardStartDate||state.activeDate}
function dashboardCustomEnd(){return state.dashboardEndDate||state.activeDate}
async function setDashboardRangeField(field,value){
  if(field==='start')state.dashboardStartDate=value||state.activeDate;
  if(field==='end')state.dashboardEndDate=value||state.activeDate;
  state.dashboardPeriod='rango';
  await cloudLoadHistoricalForBranch(branchId(),'dashboard rango');
  saveLocal();
  renderDashboard();

function dashboardRange(){
  let end=parseDMY(state.activeDate),start=new Date(end);
  if(state.dashboardPeriod==='semana')start.setDate(end.getDate()-6);
  else if(state.dashboardPeriod==='mes')start.setDate(1);
  else if(state.dashboardPeriod==='rango'){
    start=parseDMY(dashboardCustomStart());
    end=parseDMY(dashboardCustomEnd());
    if(start>end){const tmp=start;start=end;end=tmp}
  }
  return {start,end};
}
function inDashboardRange(date){
  const {start,end}=dashboardRange(),d=parseDMY(date);
  return d>=start&&d<=end;
}
function dashboardSales(){return branchSales().filter(s=>inDashboardRange(s.date))}
function dashboardClosures(){
  const rows=branchId()==='all'?state.closures.slice():state.closures.filter(c=>c.branchId===branchId());
  return rows.filter(c=>inDashboardRange(c.date));
}
function dashboardFlowData(){
  const {start,end}=dashboardRange(),sales=dashboardSales(),out=[];
  for(const d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const date=fmtDMY(d),list=sales.filter(s=>s.date===date),sum=summary(list);
    out.push({date,label:date.slice(0,5),sales:sum.sales,orders:sum.orders});
  }
  return out;
}
function renderSalesFlowChart(){
  const rows=dashboardFlowData(),max=Math.max(1,...rows.map(r=>Number(r.sales||0)));
  return `<div class="card" style="margin-top:14px"><h3>Gráfico flujo de ventas</h3><div class="muted small" style="margin-bottom:10px">Desde ${rows[0]?.date||state.activeDate} hasta ${rows[rows.length-1]?.date||state.activeDate}</div><div style="overflow:auto;padding-bottom:4px"><div style="display:flex;align-items:flex-end;gap:8px;height:230px;min-width:${Math.max(360,rows.length*52)}px;border-left:1px solid var(--border);border-bottom:1px solid var(--border);padding:10px 8px 0">${rows.map(r=>{const h=Math.max(4,Math.round(Number(r.sales||0)/max*180));return `<div style="width:44px;text-align:center"><div class="small bold">${r.sales?clp(r.sales):''}</div><div title="${r.date} · ${clp(r.sales)} · ${r.orders} pedidos" style="height:${h}px;background:var(--orange);border-radius:8px 8px 0 0"></div><div class="small muted">${r.label}</div><div class="small">${r.orders}</div></div>`}).join('')}</div></div></div>`;
}
function topProducts(list,limit=10){const m={};list.forEach(s=>(s.items||[]).forEach(i=>{if(!m[i.name])m[i.name]={name:i.name,qty:0,total:0};m[i.name].qty+=Number(i.qty||0);m[i.name].total+=Number(i.salePrice||0)*Number(i.qty||0)}));return Object.values(m).sort((a,b)=>b.qty-a.qty||b.total-a.total).slice(0,limit)}
function saleHour(s){
  const m=String(s?.time||'').match(/(\d{1,2}):(\d{2})/);
  if(m)return Math.max(0,Math.min(23,Number(m[1]||0)));
  if(Number(s?.createdAt)>0)return new Date(Number(s.createdAt)).getHours();
  return 0;
}
function dashboardHourData(){
  const rows=Array.from({length:24},(_,h)=>({label:String(h).padStart(2,'0')+':00',sales:0,orders:0}));
  dashboardSales().forEach(s=>{const h=saleHour(s);rows[h].sales+=Number(s.total||0);rows[h].orders+=1});
  return rows;
}
function chartPath(rows,valueKey,w,h,pad){
  const max=Math.max(1,...rows.map(r=>Number(r[valueKey]||0)));
  if(rows.length===1){
    const y=h-pad-(Number(rows[0][valueKey]||0)/max)*(h-pad*2);
    return {path:`M ${pad} ${y} L ${w-pad} ${y}`,max};
  }
  const pts=rows.map((r,i)=>{
    const x=pad+(i/(rows.length-1))*(w-pad*2);
    const y=h-pad-(Number(r[valueKey]||0)/max)*(h-pad*2);
    return `${x.toFixed(1)} ${y.toFixed(1)}`;
  });
  return {path:'M '+pts.join(' L '),max};
}
function renderLineChart(title,rows,valueKey='sales',sub=''){
  const w=Math.max(520,rows.length*42),h=230,pad=30,data=chartPath(rows,valueKey,w,h,pad);
  const ticks=rows.map((r,i)=>i%Math.ceil(rows.length/8||1)===0?`<text x="${(pad+(rows.length===1?0:i/(rows.length-1))*(w-pad*2)).toFixed(1)}" y="${h-8}" font-size="11" text-anchor="middle" fill="#64748b">${r.label}</text>`:'').join('');
  const points=rows.map((r,i)=>{const x=rows.length===1?w/2:pad+(i/(rows.length-1))*(w-pad*2),y=h-pad-(Number(r[valueKey]||0)/Math.max(1,data.max))*(h-pad*2);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--orange)"><title>${r.label}: ${clp(r[valueKey]||0)} - ${r.orders||0} pedidos</title></circle>`}).join('');
  return `<div class="card"><h3>${title}</h3>${sub?`<div class="muted small" style="margin-bottom:8px">${sub}</div>`:''}<div style="overflow:auto"><svg width="${w}" height="${h}" role="img" style="min-width:${w}px;background:#fff"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e5e7eb"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#e5e7eb"/><path d="${data.path}" fill="none" stroke="var(--orange)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${points}${ticks}</svg></div></div>`;
}

function activeProducts(){return state.products.filter(p=>p.active!==false&&(!p.availableBranches||p.availableBranches.includes(branchId())||branchId()==='all'))}
function beverageDrinkSize(p){
  const saved=String(p?.drinkSize||'').trim();
  if(saved==='1.5'||saved==='3')return saved;
  const name=normProductName(p?.name);
  if(name.includes('1 5'))return '1.5';
  if(name.includes('canada dry')||name.includes('ginger ale'))return '1.5';
  if(name.includes('3')||name.includes('mr big'))return '3';
  return '';
}
function promoOptions(p){
  if(p.specialProductId)return [product(p.specialProductId)].filter(Boolean);
  const size=String(p.drinkSize||'').trim();
  return sortProductsOperational(state.products.filter(x=>x.active!==false&&x.type==='simple'&&x.trackStock!==false&&x.category==='Bebidas'&&beverageDrinkSize(x)===size));
}
function promoComponents(p,drinkId){const comps=[];if(p.baseProductId)comps.push({productId:p.baseProductId,qty:1,costAtSale:getCost(p.baseProductId)});if(p.specialProductId)comps.push({productId:p.specialProductId,qty:1,costAtSale:getCost(p.specialProductId)});else if(drinkId)comps.push({productId:drinkId,qty:1,costAtSale:getCost(drinkId)});const hielo=state.products.find(x=>String(x.name).trim().toLowerCase()==='hielo');if(hielo)comps.push({productId:hielo.id,qty:1,costAtSale:getCost(hielo.id)});return comps}
function cartSubtotal(){return state.cart.reduce((a,i)=>a+Number(i.salePrice||0)*Number(i.qty||1),0)}
function transbankFee(){return state.paymentMode==='transbank'||(state.paymentMode==='mixto'&&Number(state.mixTb||0)>0)?(state.cart.length?1000:0):0}
function cartTotal(){return cartSubtotal()+transbankFee()}
function addProductToCart(pid,drinkId=null){
  if(!canSell())return alert('Usuario solo lectura');
  const p=product(pid);if(!p)return;
  if(p.type==='promo'&&!drinkId)return showDrinkPicker(p);
  let price=p.isVariablePrice?Number(prompt('Monto',p.salePrice||0)||0):Number(p.salePrice||0),name=p.name,components=[];
  if(p.type==='promo'){const d=product(drinkId);name=`${p.name.split('+')[0].trim()} + ${d?d.name:''}`;components=promoComponents(p,drinkId)}else components=p.trackStock===false?[]:[{productId:p.id,qty:1,costAtSale:getCost(p.id)}];

function stockRequirements(items){const req={};(items||[]).forEach(i=>(i.components||[]).forEach(c=>{req[c.productId]=(req[c.productId]||0)+Number(c.qty||0)*Number(i.qty||1)}));return req}
function stockProblemsForRequirements(req,bid=branchId(),extra={}){return Object.entries(req).map(([pid,qty])=>{const p=product(pid),r=inventoryRow(pid,bid),available=Number((r||{}).stock||0)+Number(extra[pid]||0);return available<qty?`${p?p.name:pid}: disponible ${available}, requerido ${qty}`:''}).filter(Boolean)}
function stockProblemMessage(problems){return 'No hay stock suficiente. Corrige antes de guardar:\\n- '+problems.join('\\n- ')}
function stockCreditFromSale(s){return stockRequirements((s||{}).items||[])}
function invoiceStockRequirements(items){const req={};(items||[]).forEach(i=>{req[i.productId]=(req[i.productId]||0)+Number(i.qty||0)});return req}
function applyStock(comps,mult,bid=branchId()){(comps||[]).forEach(c=>{let r=inventoryRow(c.productId,bid);if(!r){r={branchId:bid,productId:c.productId,stock:0,cost:0,min:0};state.inventory.push(r)}r.stock=Math.max(0,Number(r.stock||0)+mult*Number(c.qty||0))})}
function saveSale(){
  if(!canSell())return alert('Usuario solo lectura');
  if(!getTurnOpen() && !state.editSaleId)return alert('Debes abrir el turno para registrar ventas.');
  if(!state.cart.length)return alert('No hay productos');
  if(!getSelectedCourier())return alert('Elige repartidor');

  const total=cartTotal();
  let payments={efectivo:0,transferencia:0,transbank:0};
  if(state.paymentMode==='efectivo')payments.efectivo=total;
  if(state.paymentMode==='transferencia')payments.transferencia=total;
  if(state.paymentMode==='transbank')payments.transbank=total;
  if(state.paymentMode==='mixto'){
    payments={efectivo:Number(state.mixEf||0),transferencia:Number(state.mixTr||0),transbank:Number(state.mixTb||0)};
    if(payments.efectivo+payments.transferencia+payments.transbank!==total)return alert('El pago mixto no cuadra');
  }

  const rep=state.couriers.find(c=>c.id===getSelectedCourier())||{};

  if(state.editSaleId){
    const idx=state.sales.findIndex(s=>s.id===state.editSaleId);
    if(idx<0){ state.editSaleId=null; return alert('No se encontró la venta a editar'); }

    const oldSale=state.sales[idx];
    if(oldSale.branchId!==branchId())return alert('No puedes editar pedidos de otra sucursal');
    const editProblems=stockProblemsForRequirements(stockRequirements(state.cart),oldSale.branchId,stockCreditFromSale(oldSale));
    if(editProblems.length)return alert(stockProblemMessage(editProblems));

    // Devolver stock antiguo
    oldSale.items.forEach(i=>applyStock(i.components,Number(i.qty||1),oldSale.branchId));

    const editedSale={
      ...oldSale,
      courierId:rep.id,
      courierName:rep.name,
      items:JSON.parse(JSON.stringify(state.cart)),
      subtotal:cartSubtotal(),
      transbankFee:transbankFee(),
      total,
      paymentMode:state.paymentMode,
      payments,
      editedAt:Date.now(),
      editedBy:state.currentUser.name
    };

    // Descontar stock nuevo
    editedSale.items.forEach(i=>applyStock(i.components,-Number(i.qty||1),editedSale.branchId));

    state.sales[idx]=editedSale;
    cloudSaveSale(editedSale); cloudSaveAllInventory();
    state.cart=[];
    state.editSaleId=null;
    saveLocal();
    state.view='libro';
    render();
    toast('Venta editada');
    return;
  }

  const sale={id:uid(),branchId:branchId(),date:state.activeDate,time:nowTime(),user:state.currentUser.name,courierId:rep.id,courierName:rep.name,items:JSON.parse(JSON.stringify(state.cart)),subtotal:cartSubtotal(),transbankFee:transbankFee(),total,paymentMode:state.paymentMode,payments,createdAt:Date.now()};
  const saleProblems=stockProblemsForRequirements(stockRequirements(sale.items),sale.branchId);
  if(saleProblems.length)return alert(stockProblemMessage(saleProblems));
  sale.items.forEach(i=>applyStock(i.components,-Number(i.qty||1),sale.branchId));
  state.sales.push(sale);
  cloudSaveSale(sale); cloudSaveAllInventory();
  state.cart=[];
  state.selectedHistoryDate=state.activeDate;
  state.view='libro';
  saveLocal();
  render();
  toast('Pedido registrado');
}

function addQty(map,pid,qty){if(!pid)return;map[pid]=(map[pid]||0)+Number(qty||0)}
function productIdForBase(pid){
  if(product(pid))return pid;
  const base=BASE_PRODUCTS.find(p=>p.id===pid);
  const keys=[base?.name,...(COURIER_PRODUCT_ALIASES[pid]||[])].map(normProductName).filter(Boolean);
  if(!keys.length)return pid;
  const found=state.products.find(p=>{
    const name=normProductName(p.name);
    return keys.some(key=>name===key||name.includes(key)||key.includes(name));
  });
  return found?.id||pid;
}
function selectedControlCourierId(){

  if(list.some(c=>c.id===state.controlRepCourierId))return state.controlRepCourierId;

function courierMovementRows(date=controlDate(),cid=selectedControlCourierId(),bid=branchId()){
  return (state.courierMovements||[]).filter(m=>m.branchId===bid&&m.date===date&&m.courierId===cid&&rowAfterBranchReset(m,bid));

function courierMovementMap(type,date=controlDate(),cid=selectedControlCourierId(),bid=branchId()){
  const out={};
  courierMovementRows(date,cid,bid).filter(m=>m.type===type).forEach(m=>addQty(out,m.productId,m.qty));
  return out;
}
function soldMapForCourier(date=controlDate(),cid=selectedControlCourierId(),bid=branchId(),ignoreSaleId=''){
  const out={};
  (state.sales||[]).filter(s=>s.branchId===bid&&s.date===date&&s.courierId===cid&&s.id!==ignoreSaleId&&rowAfterBranchReset(s,bid)).forEach(s=>{
    const explicit=s.courierSoldDeltas;
    if(explicit&&Object.keys(explicit).length){
      Object.values(explicit).forEach(d=>addQty(out,d.productId,Number(d.qty||0)));
      return;
    }
    (s.items||[]).forEach(i=>(i.components||[]).forEach(c=>{
      const wd=s.warehouseDeltas;
      if(wd&&!Object.prototype.hasOwnProperty.call(wd,c.productId))addQty(out,c.productId,Number(c.qty||0)*Number(i.qty||1));
    }));
  });
  return out;
}
function defaultCourierProductIds(){return new Set(COURIER_BASE_LOAD.map(([pid])=>productIdForBase(pid)))}
function isCourierControlledProduct(pid,date=controlDate(),cid=selectedControlCourierId(),bid=branchId()){
  return courierMovementRows(date,cid,bid).some(m=>m.productId===pid&&m.type==='load'&&Number(m.qty||0)>0);
}
function courierAvailableMap(date=controlDate(),cid=selectedControlCourierId(),bid=branchId(),ignoreSaleId=''){
  const loads=courierMovementMap('load',date,cid,bid),returns=courierMovementMap('return',date,cid,bid),sold=soldMapForCourier(date,cid,bid,ignoreSaleId);
  const ids=new Set([...Object.keys(loads),...Object.keys(returns),...Object.keys(sold),...COURIER_BASE_LOAD.map(([pid])=>productIdForBase(pid))]);
  const out={};
  ids.forEach(pid=>out[pid]=Number(loads[pid]||0)-Number(sold[pid]||0)-Number(returns[pid]||0));
  return out;
}
function saleWarehouseDeltasForCourier(sale,ignoreSaleId=''){
  const req=saleInventoryDeltas(sale.items,1),available=courierAvailableMap(sale.date,sale.courierId,sale.branchId,ignoreSaleId),out={};
  const courierSold={};
  Object.values(req).forEach(d=>{
    const qty=Number(d.stockDelta||0),pid=d.productId;
    const fromCourier=Math.min(qty,Math.max(0,Number(available[pid]||0)));
    const fromWarehouse=qty-fromCourier;
    if(fromCourier>0)addQty(courierSold,pid,fromCourier);
    if(fromWarehouse>0)addInventoryDelta(out,pid,-fromWarehouse);
  });
  sale.courierSoldDeltas=Object.fromEntries(Object.entries(courierSold).map(([pid,qty])=>[pid,{productId:pid,qty}]));
  return out;
}
function existingSaleWarehouseDeltas(sale){
  if((sale||{}).warehouseDeltas)return sale.warehouseDeltas;
  const req=saleInventoryDeltas((sale||{}).items||[],1),out={},courierSold=(sale||{}).courierSoldDeltas||{};
  if(Object.keys(courierSold).length){
    Object.values(req).forEach(d=>{
      const fromCourier=Number((courierSold[d.productId]||{}).qty||0);
      const fromWarehouse=Math.max(0,Number(d.stockDelta||0)-fromCourier);
      if(fromWarehouse>0)addInventoryDelta(out,d.productId,-fromWarehouse);
    });
    return out;
  }
  return saleInventoryDeltas((sale||{}).items||[],-1);
}
function invertInventoryDeltas(deltas){
  const out={};
  Object.values(deltas||{}).forEach(d=>addInventoryDelta(out,d.productId,-Number(d.stockDelta||0),d));
  return out;
}
function applyInventoryDeltasLocal(deltas,bid=branchId()){
  Object.values(deltas||{}).forEach(d=>{
    let r=inventoryRow(d.productId,bid);
    if(!r){r={branchId:bid,productId:d.productId,stock:0,cost:0,min:0};state.inventory.push(r)}
    const newStock=Number(r.stock||0)+Number(d.stockDelta||0);
    const p=product(d.productId);
    if(newStock<0)throw new Error(`Stock insuficiente: ${p?p.name:d.productId}. Disponible ${Number(r.stock||0)}, movimiento ${Number(d.stockDelta||0)}`);
    r.stock=newStock;
    if(d.cost!==undefined&&Number(d.cost)>0)r.cost=Number(d.cost);
    if(d.min!==undefined)r.min=Number(d.min||0);
  });
}
function courierControlSummary(date=controlDate(),cid=selectedControlCourierId(),bid=branchId()){
  const loads=courierMovementMap('load',date,cid,bid),returns=courierMovementMap('return',date,cid,bid),sold=soldMapForCourier(date,cid,bid);
  const ids=new Set([...Object.keys(loads),...Object.keys(returns),...Object.keys(sold),...COURIER_BASE_LOAD.map(([pid])=>productIdForBase(pid))]);
  return [...ids].map(pid=>{
    const delivered=Number(loads[pid]||0),soldQty=Number(sold[pid]||0),expected=delivered-soldQty,returned=Number(returns[pid]||0),diff=returned-expected;
    return {productId:pid,delivered,sold:soldQty,expected,returned,diff};
  }).filter(r=>r.delivered||r.sold||r.returned||defaultCourierProductIds().has(r.productId));
}
function baseLoadApplied(date=controlDate(),cid=selectedControlCourierId(),bid=branchId()){
  return courierMovementRows(date,cid,bid).some(m=>m.source==='base');

function courierBaseRows(){

    saveLocal();renderControlRepartidor();
    if(!result.movements.length)return alert('No se cargo ningun producto porque no hay stock disponible en inventario.');
    toast(result.skipped.length?'Carga base parcial aplicada':'Carga base aplicada');
    if(result.skipped.length){
      const lines=result.skipped.slice(0,14).map(x=>{
        const p=product(x.productId);
        return `${p?p.name:x.productId}: pedido ${x.requested}, cargado ${x.loaded}, faltan ${x.missing}`;
      });
      alert(`Carga base aplicada parcialmente.\n\nProductos sin stock suficiente:\n${lines.join('\n')}${result.skipped.length>14?'\n...':''}`);
    }
  }catch(e){console.error(e);alert(inventoryErrorMessage(e))}
}

function addInvoiceItem(){
  if(!canManage())return alert('Sin permiso');
  const provider=document.getElementById('facProv').value.trim()||'Proveedor';
  state.invoiceType=invoiceTypeValue(document.getElementById('facType')?.value||state.invoiceType);
  const pid=document.getElementById('facProd').value;
  if(!pid)return alert('Elige un producto');
  const qty=Number(document.getElementById('facQty').value||0);
  const cost=Number(document.getElementById('facCost').value||0);
  if(!qty||!cost)return alert('Cantidad y costo requeridos');
  state.invoiceProvider=provider;
  state.invoiceDraft.push({productId:pid,qty,cost});
  saveLocal();
  renderFacturas();
}
function removeInvoiceItem(idx){
  if(!canManage())return;
  state.invoiceDraft.splice(idx,1);
  saveLocal();
  renderFacturas();
}
function cancelInvoiceDraft(){
  state.invoiceDraft=[];
  state.editInvoiceId=null;
  state.invoiceProvider='';
  state.invoiceType='reposicion';
  saveLocal();
  renderFacturas();
}
function applyInvoiceStock(items,mult,bid=branchId()){
  (items||[]).forEach(i=>{
    let r=inventoryRow(i.productId,bid);
    if(!r){r={branchId:bid,productId:i.productId,stock:0,cost:0,min:0};state.inventory.push(r)}
    r.stock=Math.max(0,Number(r.stock||0)+mult*Number(i.qty||0));
    if(mult>0 && Number(i.cost||0)>0) r.cost=Number(i.cost||0);
    cloudSaveInventoryRow(r);
  });
}
function deleteInvoice(id){
  if(!canManage())return alert('Sin permiso');
  const idx=state.invoices.findIndex(f=>f.id===id);
  if(idx<0)return alert('Factura no encontrada');
  if(!confirm('¿Borrar esta factura completa y descontarla del inventario?'))return;
  const old=state.invoices[idx];
  const deleteProblems=stockProblemsForRequirements(invoiceStockRequirements(old.items),old.branchId);
  if(deleteProblems.length)return alert(stockProblemMessage(deleteProblems));
  applyInvoiceStock(old.items,-1,old.branchId);
  state.invoices.splice(idx,1);
  if(state.editInvoiceId===id){
    state.editInvoiceId=null;
    state.invoiceDraft=[];
    state.invoiceProvider='';
    state.invoiceType='reposicion';
  }
  cloudDeleteInvoice(id);
  saveLocal();
  renderFacturas();
  toast('Factura borrada');
}
function editInvoice(id){
  if(!canManage())return alert('Sin permiso');
  const f=state.invoices.find(x=>x.id===id);
  if(!f)return alert('Factura no encontrada');
  state.editInvoiceId=f.id;
  state.invoiceProvider=f.provider||'Proveedor';
  state.invoiceType=invoiceTypeValue(f.type);
  state.invoiceDraft=JSON.parse(JSON.stringify(f.items||[]));
  state.selectedMonth=monthKey(f.date);
  saveLocal();
  renderFacturas();
}
function saveInvoice(){
  if(!canManage())return alert('Sin permiso');
  const provider=(document.getElementById('facProv')?.value.trim()) || state.invoiceProvider || 'Proveedor';
  const type=invoiceTypeValue(document.getElementById('facType')?.value||state.invoiceType);
  if(!state.invoiceDraft.length && !state.editInvoiceId)return alert('Agrega productos a la factura');
  const total=state.invoiceDraft.reduce((a,i)=>a+Number(i.qty||0)*Number(i.cost||0),0);

  if(state.editInvoiceId && !state.invoiceDraft.length){
    if(confirm('La factura qued? sin productos. ¿Quieres borrar la factura completa?')){
      deleteInvoice(state.editInvoiceId);
      return;
    }
    return alert('Agrega al menos un producto o borra la factura completa');
  }

  if(state.editInvoiceId){
    const idx=state.invoices.findIndex(f=>f.id===state.editInvoiceId);
    if(idx<0){state.editInvoiceId=null;return alert('Factura no encontrada')}
    const old=state.invoices[idx];
    const editInvoiceProblems=stockProblemsForRequirements(invoiceStockRequirements(old.items),old.branchId);
    if(editInvoiceProblems.length)return alert(stockProblemMessage(editInvoiceProblems));

    // Revertir inventario anterior
    applyInvoiceStock(old.items,-1,old.branchId);

    const edited={...old,provider,type,items:JSON.parse(JSON.stringify(state.invoiceDraft)),total,editedAt:Date.now(),editedBy:state.currentUser.name};

    // Aplicar inventario nuevo
    applyInvoiceStock(edited.items,1,edited.branchId);

    state.invoices[idx]=edited;
    cloudSaveInvoice(edited);
    state.invoiceDraft=[];
    state.editInvoiceId=null;
    state.invoiceProvider='';
    state.invoiceType='reposicion';
    saveLocal();
    renderFacturas();
    toast('Factura editada');
    return;
  }

  const inv={id:uid(),branchId:branchId(),date:state.activeDate,time:nowTime(),provider,type,items:JSON.parse(JSON.stringify(state.invoiceDraft)),total,createdAt:Date.now()};
  applyInvoiceStock(inv.items,1,inv.branchId);
  state.invoices.push(inv);
  cloudSaveInvoice(inv);
  state.invoiceDraft=[];
  state.editInvoiceId=null;
  state.invoiceProvider='';
  state.invoiceType='reposicion';
  saveLocal();
  renderFacturas();
  toast('Factura ingresada');
}

function cloneData(v){return JSON.parse(JSON.stringify(v))}
function saleCloudCopy(s,status='synced'){const c=cloneData(s);c.syncStatus=status;return c}
function invoiceCloudCopy(i){return cloneData(i)}

function addInventoryDelta(map,pid,stockDelta,opts={}){
  if(!pid)return;
  if(!map[pid])map[pid]={productId:pid,stockDelta:0};
  map[pid].stockDelta+=Number(stockDelta||0);
  if(opts.cost!==undefined&&Number(opts.cost)>0)map[pid].cost=Number(opts.cost);
  if(opts.min!==undefined)map[pid].min=Number(opts.min||0);
}
function saleInventoryDeltas(items,mult){
  const deltas={};
  (items||[]).forEach(i=>(i.components||[]).forEach(c=>addInventoryDelta(deltas,c.productId,Number(mult||1)*Number(c.qty||0)*Number(i.qty||1))));
  return deltas;
}
function invoiceInventoryDeltas(items,mult){
  const deltas={};
  (items||[]).forEach(i=>addInventoryDelta(deltas,i.productId,Number(mult||1)*Number(i.qty||0),Number(mult||1)>0?{cost:Number(i.cost||0)}:{}));
  return deltas;
}
function mergeInventoryDeltas(...maps){
  const out={};
  maps.forEach(m=>Object.values(m||{}).forEach(d=>addInventoryDelta(out,d.productId,d.stockDelta,d)));
  return out;
}
function syncLocalInventoryRows(rows){

    if(!r){r={branchId:row.branchId,productId:row.productId,stock:0,cost:0,min:0};state.inventory.push(r)}

}

async function cloudCommitInventoryDeltas(bid,deltas,meta={}){
  if(!canUseFirebase())throw new Error('Firebase no disponible');
  const f=window.FONO_FIREBASE;
  const entries=Object.values(deltas||{}).filter(d=>d&&d.productId&&(Number(d.stockDelta||0)!==0||d.cost!==undefined||d.min!==undefined));
  const committed=[];
  await f.runTransaction(f.db,async tx=>{
    const reads=[];
    for(const d of entries){
      const ref=f.doc(f.db,'inventory',`${bid}_${d.productId}`);
      const snap=await tx.get(ref);
      reads.push({d,ref,snap});
    }
    for(const {d,ref,snap} of reads){
      const existing=snap.exists()?snap.data():(inventoryRow(d.productId,bid)||{branchId:bid,productId:d.productId,stock:0,cost:0,min:0});
      const newStock=Number(existing.stock||0)+Number(d.stockDelta||0);
      const p=product(d.productId);
      if(newStock<0)throw new Error(`Stock insuficiente: ${p?p.name:d.productId}. Disponible ${Number(existing.stock||0)}, movimiento ${Number(d.stockDelta||0)}`);
      const localRow={
        branchId:bid,
        productId:d.productId,
        stock:newStock,
        cost:d.cost!==undefined&&Number(d.cost)>0?Number(d.cost):Number(existing.cost||0),
        min:d.min!==undefined?Number(d.min||0):Number(existing.min||0)
      };
      tx.set(ref,{...localRow,updatedAt:f.serverTimestamp()},{merge:true});
      committed.push(localRow);
    }
    if(meta.sale){
      applyCostsFromInventoryRows(meta.sale.items,committed);
      tx.set(f.doc(f.db,'sales',meta.sale.id),{...saleCloudCopy(meta.sale,'synced'),updatedAt:f.serverTimestamp()});
    }
    if(meta.deleteSaleId)tx.delete(f.doc(f.db,'sales',meta.deleteSaleId));
    if(meta.invoice)tx.set(f.doc(f.db,'invoices',meta.invoice.id),{...invoiceCloudCopy(meta.invoice),updatedAt:f.serverTimestamp()});
    if(meta.deleteInvoiceId)tx.delete(f.doc(f.db,'invoices',meta.deleteInvoiceId));
    (meta.courierMovements||[]).forEach(m=>tx.set(f.doc(f.db,'courierMovements',m.id),{...m,updatedAt:f.serverTimestamp()}));
    (meta.deleteCourierMovementIds||[]).forEach(id=>tx.delete(f.doc(f.db,'courierMovements',id)));
  });
  syncLocalInventoryRows(committed);
  return committed;
}
async function cloudCommitCourierBaseLoadPartial(bid,movements){
  if(!canUseFirebase())throw new Error('Firebase no disponible');
  const f=window.FONO_FIREBASE;
  const committed=[],savedMovements=[],skipped=[];
  const wanted=(movements||[]).filter(m=>m&&m.productId&&Number(m.qty||0)>0);
  await f.runTransaction(f.db,async tx=>{
    const reads=[];
    for(const m of wanted){
      const ref=f.doc(f.db,'inventory',`${bid}_${m.productId}`);
      const snap=await tx.get(ref);
      reads.push({m,ref,snap});
    }
    for(const {m,ref,snap} of reads){
      const existing=snap.exists()?snap.data():(inventoryRow(m.productId,bid)||{branchId:bid,productId:m.productId,stock:0,cost:0,min:0});
      const requested=Number(m.qty||0);
      const currentStock=Number(existing.stock||0);
      const loaded=Math.min(requested,Math.max(0,currentStock));
      if(loaded<=0){
        skipped.push({productId:m.productId,requested,loaded:0,missing:requested});
        continue;
      }
      const localRow={
        branchId:bid,
        productId:m.productId,
        stock:currentStock-loaded,
        cost:Number(existing.cost||0),
        min:Number(existing.min||0)
      };
      const saved={...m,qty:loaded,requestedQty:requested,partial:loaded<requested};
      tx.set(ref,{...localRow,updatedAt:f.serverTimestamp()},{merge:true});
      tx.set(f.doc(f.db,'courierMovements',saved.id),{...saved,updatedAt:f.serverTimestamp()});
      committed.push(localRow);
      savedMovements.push(saved);
      if(loaded<requested)skipped.push({productId:m.productId,requested,loaded,missing:requested-loaded});
    }
  });
  syncLocalInventoryRows(committed);
  return {rows:committed,movements:savedMovements,skipped};
}
function applyInvoiceStockLocal(items,mult,bid=branchId()){
  (items||[]).forEach(i=>{
    let r=inventoryRow(i.productId,bid);
    if(!r){r={branchId:bid,productId:i.productId,stock:0,cost:0,min:0};state.inventory.push(r)}

}
function mergeById(cloudRows,localRows,key='id'){

async function syncPendingSales(){
  if(!canUseFirebase())return;
  const pending=(state.sales||[]).filter(s=>s.syncStatus&&s.syncStatus!=='synced');
  for(const sale of pending){
    try{
      const deltas=existingSaleWarehouseDeltas(sale);
      sale.warehouseDeltas=deltas;
      const rows=await cloudCommitInventoryDeltas(sale.branchId,deltas,{sale});
      applyCostsFromInventoryRows(sale.items,rows);
      sale.syncStatus='synced';
      sale.syncedAt=Date.now();
    }catch(e){
      console.error('Venta pendiente no sincronizada',e);
    }
  }
  saveLocal();
}

    editedSale.items.forEach(i=>applyStock(i.components,-Number(i.qty||1),editedSale.branchId));

async function cloudCommitInventoryCapitalReset(rows,reset){
  if(!canUseFirebase())throw new Error('Firebase no disponible');
  const f=window.FONO_FIREBASE;
  const batch=f.writeBatch(f.db);
  (rows||[]).forEach(r=>{
    batch.set(f.doc(f.db,'inventory',`${r.branchId}_${r.productId}`),{
      ...r,
      updatedAt:f.serverTimestamp()
    });
  });
  batch.set(f.doc(f.db,'capitalResets',reset.id),{
    ...reset,
    updatedAt:f.serverTimestamp()
  });
  await batch.commit();
}
async function resetInventoryAndCapital(){
  if(!canManage())return alert('Solo administrador puede usar este reset');
  const bid=branchId();
  if(bid==='all')return alert('Elige una sucursal especifica. No se permite resetear todas juntas.');
  if(!canUseFirebase())return alert('Firebase no esta disponible. No se puede hacer reset seguro.');
  if(!confirm(`Esto dejara en cero inventario y capital de ${branchName(bid)}. Las ventas historicas no se borran. Continuar?`))return;
  const typed=prompt('Escribe RESET para confirmar');
  if(typed!=='RESET')return alert('Reset cancelado');
  seedInventory();
  const rows=state.inventory.filter(r=>r.branchId===bid);
  const backupRows=cloneData(rows);
  const backupResets=cloneData(state.capitalResets||[]);
  const createdAt=Date.now();
  const reset={id:`${bid}_${createdAt}`,branchId:bid,date:state.activeDate,time:nowTime(),user:state.currentUser.name,type:'inventoryCapitalReset',createdAt,rows:rows.length};
  rows.forEach(r=>{
    r.stock=0;
    r.cost=0;
    r.min=0;
    r.resetAt=createdAt;
    r.resetBy=state.currentUser.name;
  });
  state.capitalResets.push(reset);
  try{
    await cloudCommitInventoryCapitalReset(rows,reset);
    saveLocal();
    render();
    toast('Inventario y capital reiniciados');
  }catch(e){
    backupRows.forEach(b=>{
      const r=inventoryRow(b.productId,b.branchId);
      if(r)Object.assign(r,b);
    });
    state.capitalResets=backupResets;
    console.error(e);
    alert('No se pudo hacer el reset en Firebase. No se aplicaron cambios locales.');
  }
}
