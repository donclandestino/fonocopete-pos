<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS Fonocopete · Sistema limpio v5</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--orange:#f97316;--orange2:#fb923c;--border:#e5e7eb;--green:#16a34a;--red:#dc2626;--dark:#0f172a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card,.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px}
.login-card{width:min(430px,100%)}h1,h2,h3,h4{margin:0 0 10px}
input,select,button{font:inherit}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#fff}
.btn{border:none;border-radius:12px;padding:10px 12px;cursor:pointer}.btn-primary{background:var(--orange);color:#111827;font-weight:700}.btn-secondary{background:#f3f4f6;color:#111827}.btn-danger{background:#dc2626;color:#fff}.btn-green{background:#16a34a;color:#fff;font-weight:700}.btn:disabled{opacity:.6;cursor:not-allowed}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#0f172a;color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:22px;font-weight:800;color:var(--orange2);line-height:1.15}.sub{font-size:12px;color:#cbd5e1;margin:8px 0 16px}
.menu button{display:block;width:100%;margin:8px 0;padding:10px 12px;border:none;border-radius:12px;background:#1e293b;color:#fff;text-align:left;cursor:pointer}.menu button.active,.menu button:hover{background:var(--orange);color:#111827;font-weight:700}
.main{padding:18px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{font-size:28px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 390px;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab{padding:10px 14px;border:1px solid var(--border);background:#fff;border-radius:999px;cursor:pointer;white-space:nowrap}.tab.active{background:var(--orange);border-color:var(--orange);font-weight:700}
.prod{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;min-height:100px}.prod:hover{border-color:var(--orange)}.prod .price{color:#f97316;font-weight:800;font-size:18px}
.muted{color:var(--muted)}.orange{color:var(--orange)}.red{color:var(--red)}.green{color:var(--green)}.bold{font-weight:700}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:12px;margin:4px 4px 0 0}.item{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:12px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--border)}.table tr.total{border-top:2px solid #111;font-weight:800}.list{max-height:520px;overflow:auto}
.danger-card{border:2px solid #ef4444}.success-card{border:2px solid #22c55e}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:white;padding:12px 16px;border-radius:12px;z-index:50;opacity:0;transition:.25s}.toast.show{opacity:1}
@media (max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.grid3,.grid4{grid-template-columns:1fr}.hide-mobile{display:none}}
</style>
</head>

<div id="toast" class="toast"></div>

<div id="loginRoot" class="login-wrap">
  <div class="login-card">
    <h2>POS Fonocopete</h2>
    <div class="muted" style="margin-bottom:12px">Simplemente no fallamos · sistema limpio</div>
    <label>Usuario</label>
    <select id="loginUser" class="input" style="margin-bottom:10px"></select>
    <label>Contraseña</label>
    <input id="loginPass" class="input" type="password" placeholder="Escribe tu clave" style="margin-bottom:14px">
    <button class="btn btn-primary" style="width:100%" onclick="login()">Ingresar</button>
    <div class="muted small" style="margin-top:10px">Base limpia en 0. Dueño solo lectura.</div>
  </div>
</div>

<div id="appRoot" class="app hidden">

      <div class="card"><h4>Turno</h4><div class="stat" id="kpiTurn">-</div></div>
    </div>
    <section id="view-dashboard" class="view"></section>
    <section id="view-venta" class="view hidden"></section>
    <section id="view-libro" class="view hidden"></section>
    <section id="view-mayor" class="view hidden"></section>
    <section id="view-capital" class="view hidden"></section>
    <section id="view-facturas" class="view hidden"></section>
    <section id="view-repartidores" class="view hidden"></section>
    <section id="view-inventario" class="view hidden"></section>
    <section id="view-productos" class="view hidden"></section>
    <section id="view-usuarios" class="view hidden"></section>
    <section id="view-turno" class="view hidden"></section>
    <section id="view-admin" class="view hidden"></section>
  </main>
</div>

function normalizeProducts(list){
  return (list||[]).filter(p=>p&&p.name).map(p=>({
    id:String(p.id||uid()),name:String(p.name||''),category:String(p.category||'Otros'),
    salePrice:Number(p.salePrice||0),type:p.type||'simple',active:p.active!==false,trackStock:p.trackStock!==false,
    drinkSize:p.drinkSize||'',baseProductId:p.baseProductId||'',specialProductId:p.specialProductId||'',
    availableBranches:p.availableBranches||null,isVariablePrice:!!p.isVariablePrice
  }));
}
function seedInventory(){
  const index=new Set(state.inventory.map(r=>r.branchId+'|'+r.productId));
  state.branches.forEach(b=>{
    state.products.filter(p=>p.type==='simple'&&p.trackStock!==false).forEach(p=>{
      const key=b.id+'|'+p.id;
      if(!index.has(key)) state.inventory.push({branchId:b.id,productId:p.id,stock:0,cost:0,min:0});
    });
  });
}
function loadLocal(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const saved=JSON.parse(raw);
      Object.assign(state,saved);
      state.currentUser=null;
      state.products=normalizeProducts(state.products&&state.products.length?state.products:BASE_PRODUCTS);
      state.users=state.users&&state.users.length?state.users:BASE_USERS;
      state.branches=state.branches&&state.branches.length?state.branches:BRANCHES;
    }catch(e){console.error(e)}
  }
  if(!Array.isArray(state.sales))state.sales=[];
  if(!Array.isArray(state.invoices))state.invoices=[];
  if(!Array.isArray(state.closures))state.closures=[];
  if(!Array.isArray(state.inventory))state.inventory=[];
  seedInventory();
}
function saveLocal(){
  const clean=JSON.parse(JSON.stringify(state));

  localStorage.setItem(STORAGE_KEY,JSON.stringify(clean));
}

function uid(){return Math.random().toString(36).slice(2,10)}
function clp(n){return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(n||0))}
function todayDMY(){return fmtDMY(new Date())}
function fmtDMY(d){return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`}
function parseDMY(s){const [d,m,y]=String(s||todayDMY()).split('-').map(Number);return new Date(y,(m||1)-1,d||1)}
function monthKey(s){const p=String(s||todayDMY()).split('-');return `${p[1]}-${p[2]}`}
function nowTime(){return new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000)}
function shiftDate(s,delta){const d=parseDMY(s);d.setDate(d.getDate()+delta);return fmtDMY(d)}
function shiftMonth(mk,delta){let [m,y]=String(mk).split('-').map(Number);m+=delta;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return `${String(m).padStart(2,'0')}-${y}`}

function branchId(){if(!state.currentUser)return state.selectedBranchId;return state.currentUser.role==='dueno'?state.selectedBranchId:state.currentUser.branchId}
function branchName(id=branchId()){return id==='all'?'Todas las sucursales':((state.branches.find(b=>b.id===id)||{}).name||id)}
function isOwner(){return state.currentUser&&state.currentUser.role==='dueno'}
function isAdmin(){return state.currentUser&&state.currentUser.role==='admin'}
function isOperator(){return state.currentUser&&state.currentUser.role==='operador'}
function canSell(){return isAdmin()||isOperator()}
function canManage(){return isAdmin()}
function canSeeFinancial(){return isOwner()||isAdmin()}
function visible(view){
  if(isOwner())return ['dashboard','libro','mayor','capital','facturas','repartidores','inventario','productos','usuarios','turno','admin'].includes(view);
  if(isAdmin())return ['dashboard','venta','libro','mayor','capital','facturas','repartidores','inventario','productos','usuarios','turno'].includes(view);
  if(isOperator())return ['venta','libro','repartidores','inventario','turno'].includes(view);
  return false;
}
function product(id){return state.products.find(p=>p.id===id)}
function inventoryRow(pid,bid=branchId()){return state.inventory.find(r=>r.branchId===bid&&r.productId===pid)}
function getCost(pid,bid=branchId()){return Number((inventoryRow(pid,bid)||{}).cost||0)}
function couriers(){return state.couriers.filter(c=>c.active&&c.branchId===branchId())}
function branchSales(bid=branchId()){return bid==='all'?state.sales.slice():state.sales.filter(s=>s.branchId===bid)}
function daySales(date=state.activeDate,bid=branchId()){return branchSales(bid).filter(s=>s.date===date)}
function monthSales(mk=state.selectedMonth,bid=branchId()){return branchSales(bid).filter(s=>monthKey(s.date)===mk)}
function monthInvoices(mk=state.selectedMonth,bid=branchId()){return state.invoices.filter(i=>(bid==='all'||i.branchId===bid)&&monthKey(i.date)===mk)}
function monthClosures(mk=state.selectedMonth,bid=branchId()){return state.closures.filter(c=>(bid==='all'||c.branchId===bid)&&monthKey(c.date)===mk)}
function inventoryValue(bid=branchId()){return state.inventory.filter(r=>bid==='all'||r.branchId===bid).reduce((a,r)=>a+Number(r.stock||0)*Number(r.cost||0),0)}
function periodPayments(list){return list.reduce((a,s)=>{a.efectivo+=Number(s.payments?.efectivo||0);a.transferencia+=Number(s.payments?.transferencia||0);a.transbank+=Number(s.payments?.transbank||0);return a},{efectivo:0,transferencia:0,transbank:0})}
function saleCost(s){return (s.items||[]).reduce((sum,item)=>sum+(item.components||[]).reduce((a,c)=>a+Number(c.costAtSale||0)*Number(c.qty||0),0)*Number(item.qty||1),0)}
function saleProfit(s){return Number(s.total||0)-saleCost(s)}
function summary(list){return list.reduce((a,s)=>{a.sales+=Number(s.total||0);a.cost+=saleCost(s);a.profit+=saleProfit(s);a.orders++;a.ef+=Number(s.payments?.efectivo||0);a.tr+=Number(s.payments?.transferencia||0);a.tb+=Number(s.payments?.transbank||0);return a},{sales:0,cost:0,profit:0,orders:0,ef:0,tr:0,tb:0})}
function expectedCashForMonth(mk=state.selectedMonth,bid=branchId()){const list=monthSales(mk,bid),pay=periodPayments(list),inv=monthInvoices(mk,bid).reduce((a,i)=>a+Number(i.total||0),0),fuel=monthClosures(mk,bid).reduce((a,c)=>a+Number(c.fuelExpense||0),0);return Math.max(0,pay.efectivo+pay.transferencia+pay.transbank-inv-fuel)}
function pendingCapitalForMonth(mk=state.selectedMonth,bid=branchId()){const cost=monthSales(mk,bid).reduce((a,s)=>a+saleCost(s),0),inv=monthInvoices(mk,bid).reduce((a,i)=>a+Number(i.total||0),0);return Math.max(0,cost-inv)}
function costMoneyInCaja(mk=state.selectedMonth,bid=branchId()){
  // Dinero de costo recuperado por ventas. Esto NO resta facturas,
  // porque las facturas son inventario comprado y se reflejan en bodega.
  return monthSales(mk,bid).reduce((a,s)=>a+saleCost(s),0);
}
function controlledCapitalTotal(mk=state.selectedMonth,bid=branchId()){
  return inventoryValue(bid) + costMoneyInCaja(mk,bid);
}
function percent(n,t){return t?Math.round(Number(n||0)/Number(t||0)*100):0}

function setDashboardDate(v){state.activeDate=v;state.selectedHistoryDate=v;state.selectedCourierDate=v;state.selectedMonth=monthKey(v);saveLocal();render()}
function dashboardSales(){const list=branchSales();if(state.dashboardPeriod==='dia')return list.filter(s=>s.date===state.activeDate);if(state.dashboardPeriod==='semana'){const end=parseDMY(state.activeDate),start=new Date(end);start.setDate(end.getDate()-6);return list.filter(s=>{const d=parseDMY(s.date);return d>=start&&d<=end})}if(state.dashboardPeriod==='mes')return list.filter(s=>monthKey(s.date)===state.selectedMonth);return list}
function topProducts(list,limit=10){const m={};list.forEach(s=>(s.items||[]).forEach(i=>{if(!m[i.name])m[i.name]={name:i.name,qty:0,total:0};m[i.name].qty+=Number(i.qty||0);m[i.name].total+=Number(i.salePrice||0)*Number(i.qty||0)}));return Object.values(m).sort((a,b)=>b.qty-a.qty||b.total-a.total).slice(0,limit)}

  const menuItems=[['dashboard','Dashboard'],['venta','Venta rápida'],['libro','Libro diario'],['mayor','Libro mayor'],['capital','Control capital'],['facturas','Facturas entrantes'],['repartidores','Repartidores'],['inventario','Inventario'],['productos','Productos'],['usuarios','Usuarios'],['turno','Turno'],['admin','Vista dueño']];

  ({dashboard:renderDashboard,venta:renderVenta,libro:renderLibro,mayor:renderMayor,capital:renderCapital,facturas:renderFacturas,repartidores:renderRepartidores,inventario:renderInventario,productos:renderProductos,usuarios:renderUsuarios,turno:renderTurno,admin:renderAdmin}[state.view]||renderDashboard)();

function navDate(current,cb){return `<div class="row" style="margin-bottom:12px"><button class="btn btn-secondary" onclick="${cb}('${shiftDate(current,-1)}')">← Día anterior</button><div class="card" style="padding:10px 14px;background:#f8fafc"><b>Fecha:</b> ${current}</div><button class="btn btn-secondary" onclick="${cb}('${shiftDate(current,1)}')">Día siguiente →</button><input class="input" style="max-width:160px" value="${current}" onchange="${cb}(this.value)"></div>`}
function navMonth(current,cb){return `<div class="row" style="margin-bottom:12px"><button class="btn btn-secondary" onclick="${cb}('${shiftMonth(current,-1)}')">← Mes anterior</button><div class="card" style="padding:10px 14px;background:#f8fafc"><b>Mes:</b> ${current}</div><button class="btn btn-secondary" onclick="${cb}('${shiftMonth(current,1)}')">Mes siguiente →</button><input class="input" style="max-width:140px" value="${current}" onchange="${cb}(this.value)"></div>`}

function renderDashboard(){
  const list=dashboardSales(),sm=summary(list),pay=periodPayments(list),totalPay=pay.efectivo+pay.transferencia+pay.transbank,top=topProducts(list,10);
  const low=state.inventory.filter(r=>(branchId()==='all'||r.branchId===branchId())&&Number(r.min)>0&&Number(r.stock)<=Number(r.min)).map(r=>({...r,p:product(r.productId)}));
  const fuel=state.dashboardPeriod==='mes'?monthClosures(state.selectedMonth).reduce((a,c)=>a+Number(c.fuelExpense||0),0):0,profit=sm.profit-fuel;
  document.getElementById('view-dashboard').innerHTML=`
  <div class="card" style="margin-bottom:14px"><h3>Dashboard</h3><div class="row"><button class="btn ${state.dashboardPeriod==='dia'?'btn-primary':'btn-secondary'}" onclick="setDashboardPeriod('dia')">Día</button><button class="btn ${state.dashboardPeriod==='semana'?'btn-primary':'btn-secondary'}" onclick="setDashboardPeriod('semana')">Semana</button><button class="btn ${state.dashboardPeriod==='mes'?'btn-primary':'btn-secondary'}" onclick="setDashboardPeriod('mes')">Mes</button></div><div style="margin-top:12px">${navDate(state.activeDate,'setDashboardDate')}</div></div>
  ${low.length&&!isOperator()?`<div class="card danger-card" style="margin-bottom:14px"><h3>⚠ Stock crítico</h3><div class="list">${low.map(x=>`<div class="item between"><span>${x.p?.name||x.productId}</span><b class="red">${x.stock} / mín ${x.min}</b></div>`).join('')}</div></div>`:''}
  <div class="grid3"><div class="card"><h3>Ventas</h3><div class="stat">${clp(sm.sales)}</div></div><div class="card"><h3>Pedidos</h3><div class="stat">${sm.orders}</div></div><div class="card"><h3>Ticket promedio</h3><div class="stat">${clp(sm.orders?Math.round(sm.sales/sm.orders):0)}</div></div>
  ${canSeeFinancial()?`<div class="card"><h3>Costo vendido</h3><div class="stat">${clp(sm.cost)}</div></div><div class="card"><h3>Ganancia</h3><div class="stat">${clp(profit)}</div></div><div class="card"><h3>Margen</h3><div class="stat">${percent(profit,sm.sales)}%</div></div><div class="card"><h3>Inventario valorizado</h3><div class="stat">${clp(inventoryValue())}</div></div><div class="card"><h3>Capital pendiente</h3><div class="stat">${clp(pendingCapitalForMonth())}</div></div>`:''}</div>
  <div class="grid2" style="margin-top:14px"><div class="card"><h3>Top 10 productos más vendidos</h3><div class="list">${top.map((x,i)=>`<div class="item between"><span><b>${i+1}. ${x.name}</b><div class="muted small">${x.qty} unidades</div></span><b>${clp(x.total)}</b></div>`).join('')||'<div class="muted">Sin ventas.</div>'}</div></div><div class="card"><h3>Medios de pago</h3><div class="item between"><span>Efectivo</span><b>${clp(pay.efectivo)} · ${percent(pay.efectivo,totalPay)}%</b></div><div class="item between"><span>Transferencia</span><b>${clp(pay.transferencia)} · ${percent(pay.transferencia,totalPay)}%</b></div><div class="item between"><span>Transbank</span><b>${clp(pay.transbank)} · ${percent(pay.transbank,totalPay)}%</b></div></div></div>`;
}

function promoComponents(p,drinkId){const comps=[];if(p.baseProductId)comps.push({productId:p.baseProductId,qty:1,costAtSale:getCost(p.baseProductId)});if(p.specialProductId)comps.push({productId:p.specialProductId,qty:1,costAtSale:getCost(p.specialProductId)});else if(drinkId)comps.push({productId:drinkId,qty:1,costAtSale:getCost(drinkId)});const hielo=state.products.find(x=>String(x.name).trim().toLowerCase()==='hielo');if(hielo)comps.push({productId:hielo.id,qty:1,costAtSale:getCost(hielo.id)});return comps}

function transbankFee(){return state.paymentMode==='transbank'||(state.paymentMode==='mixto'&&Number(state.mixTb||0)>0)?(state.cart.length?1000:0):0}

function addProductToCart(pid,drinkId=null){
  if(!canSell())return alert('Usuario solo lectura');

ct>${state.paymentMode==='mixto'?`<div class="row" style="margin-top:8px"><input class="input" style="flex:1" type="number" placeholder="Efectivo" value="${state.mixEf}" oninput="state.mixEf=Number(this.value||0)"><input class="input" style="flex:1" type="number" placeholder="Transfer." value="${state.mixTr}" oninput="state.mixTr=Number(this.value||0)"><input class="input" style="flex:1" type="number" placeholder="Transbank" value="${state.mixTb}" oninput="state.mixTb=Number(this.value||0)"></div>`:''}<label style="margin-top:8px">Repartidor</label><select class="input" onchange="state.selectedCourierId=this.value">${couriers().map(c=>`<option value="${c.id}" ${state.selectedCourierId===c.id?'selected':''}>${c.name}</option>`).join('')}</select><div class="item between"><span>Cargo Transbank</span><b>${clp(transbankFee())}</b></div><div class="item between"><span>Total</span><b>${clp(cartTotal())}</b></div><div class="row"><button class="btn btn-secondary" onclick="cancelCart()">Cancelar</button><button class="btn btn-primary" onclick="saveSale()">${state.editSaleId?'Guardar edición':'Guardar pedido'}</button></div></div></div>`

function applyStock(comps,mult,bid=branchId()){(comps||[]).forEach(c=>{let r=inventoryRow(c.productId,bid);if(!r){r={branchId:bid,productId:c.productId,stock:0,cost:0,min:0};state.inventory.push(r)}r.stock=Math.max(0,Number(r.stock||0)+mult*Number(c.qty||0))})}
function saveSale(){
  if(!canSell())return alert('Usuario solo lectura');
  if(!state.turnOpen && !state.editSaleId)return alert('Debes abrir el turno para registrar ventas.');
  if(!state.cart.length)return alert('No hay productos');
  if(!state.selectedCourierId)return alert('Elige repartidor');

  const total=cartTotal();
  let payments={efectivo:0,transferencia:0,transbank:0};
  if(state.paymentMode==='efectivo')payments.efectivo=total;
  if(state.paymentMode==='transferencia')payments.transferencia=total;
  if(state.paymentMode==='transbank')payments.transbank=total;
  if(state.paymentMode==='mixto'){
    payments={efectivo:Number(state.mixEf||0),transferencia:Number(state.mixTr||0),transbank:Number(state.mixTb||0)};
    if(payments.efectivo+payments.transferencia+payments.transbank!==total)return alert('El pago mixto no cuadra');
  }

  const rep=state.couriers.find(c=>c.id===state.selectedCourierId)||{};

  if(state.editSaleId){
    const idx=state.sales.findIndex(s=>s.id===state.editSaleId);
    if(idx<0){ state.editSaleId=null; return alert('No se encontró la venta a editar'); }

    const oldSale=state.sales[idx];

    // Devolver stock antiguo
    oldSale.items.forEach(i=>applyStock(i.components,Number(i.qty||1),oldSale.branchId));

    const editedSale={
      ...oldSale,
      courierId:rep.id,
      courierName:rep.name,
      items:JSON.parse(JSON.stringify(state.cart)),
      subtotal:cartSubtotal(),
      transbankFee:transbankFee(),
      total,
      paymentMode:state.paymentMode,
      payments,
      editedAt:Date.now(),
      editedBy:state.currentUser.name
    };

    // Descontar stock nuevo
    editedSale.items.forEach(i=>applyStock(i.components,-Number(i.qty||1),editedSale.branchId));

    state.sales[idx]=editedSale;
    state.cart=[];
    state.editSaleId=null;
    saveLocal();
    state.view='libro';
    render();
    toast('Venta editada');
    return;
  }

  const sale={id:uid(),branchId:branchId(),date:state.activeDate,time:nowTime(),user:state.currentUser.name,courierId:rep.id,courierName:rep.name,items:JSON.parse(JSON.stringify(state.cart)),subtotal:cartSubtotal(),transbankFee:transbankFee(),total,paymentMode:state.paymentMode,payments,createdAt:Date.now()};
  sale.items.forEach(i=>applyStock(i.components,-Number(i.qty||1),sale.branchId));
  state.sales.push(sale);
  state.cart=[];
  state.selectedHistoryDate=state.activeDate;
  state.view='libro';
  saveLocal();
  render();
  toast('Pedido registrado');
}

function renderTurno(){
  const ds=daySales(state.activeDate),sm=summary(ds),fuel=Number(state.fuelExpense||0),clos=monthClosures(monthKey(state.activeDate)).sort((a,b)=>b.createdAt-a.createdAt);
  document.getElementById('view-turno').innerHTML=`<div class="grid2"><div><div class="card"><h3>Turno actual</h3><label>Fecha activa</label><input id="turnDate" class="input" value="${state.activeDate}" ${isOwner()?'disabled':''}><div style="margin-top:10px">${isOwner()?'<div class="muted">Dueño solo lectura.</div>':state.turnOpen?`<button class="btn btn-danger" onclick="closeShift()">Cerrar turno</button>`:`<div class="row"><button class="btn btn-green" disabled>Turno cerrado</button><button class="btn btn-primary" onclick="reopenSameDay()">Reabrir turno del mismo día</button></div>`}</div></div><div class="card" style="margin-top:14px"><h3>Resumen de cierre del día</h3><div class="item between"><span>Ventas totales</span><b>${clp(sm.sales)}</b></div><div class="item between"><span>Pedidos</span><b>${sm.orders}</b></div><div class="item between"><span>Efectivo</span><b>${clp(sm.ef)}</b></div><div class="item between"><span>Transferencias</span><b>${clp(sm.tr)}</b></div><div class="item between"><span>Transbank</span><b>${clp(sm.tb)}</b></div><div class="item between"><span>Costo productos</span><b>${clp(sm.cost)}</b></div><label>Gasto bencina</label><input id="fuelInput" class="input" type="number" value="${state.fuelExpense}" ${isOwner()?'disabled':''} placeholder="Ej: 3000"><button class="btn btn-secondary" style="margin-top:8px" ${isOwner()?'disabled':''} onclick="state.fuelExpense=document.getElementById('fuelInput').value;saveLocal();renderTurno()">Actualizar bencina</button><div class="item between"><span>Ganancia final</span><b>${clp(sm.profit-fuel)}</b></div></div></div><div><div class="card"><h3>Nuevo día</h3><input id="newDay" class="input" value="${shiftDate(state.activeDate,1)}" ${isOwner()?'disabled':''}><button class="btn btn-primary" style="margin-top:10px" ${isOwner()?'disabled':''} onclick="openNewDay()">Abrir nuevo día</button></div><div class="card" style="margin-top:14px"><h3>Historial de cierres</h3><div class="list">${clos.map(c=>`<div class="item"><b>${c.date}</b><span style="float:right"><b>${clp(c.sales)}</b></span><div class="small muted">Costo: ${clp(c.cost)} · Bencina: ${clp(c.fuelExpense)} · Ganancia final: ${clp(c.realProfit)}</div></div>`).join('')||'<div class="muted">Sin cierres.</div>'}</div></div></div></div>`
}
function closeShift(){if(isOwner())return alert('Dueño solo lectura');const fuelEl=document.getElementById('fuelInput'); if(fuelEl) state.fuelExpense=fuelEl.value; const sm=summary(daySales(state.activeDate)),fuel=Number(state.fuelExpense||0);state.closures=state.closures.filter(c=>!(c.branchId===branchId()&&c.date===state.activeDate));state.closures.push({id:uid(),branchId:branchId(),date:state.activeDate,time:nowTime(),user:state.currentUser.name,sales:sm.sales,cost:sm.cost,profit:sm.profit,fuelExpense:fuel,realProfit:sm.profit-fuel,orders:sm.orders,payments:{efectivo:sm.ef,transferencia:sm.tr,transbank:sm.tb},createdAt:Date.now()});state.turnOpen=false;saveLocal();renderTurno();toast('Turno cerrado')}
function openNewDay(){if(isOwner())return;state.activeDate=document.getElementById('newDay').value||shiftDate(state.activeDate,1);state.selectedHistoryDate=state.activeDate;state.selectedCourierDate=state.activeDate;state.selectedMonth=monthKey(state.activeDate);state.turnOpen=true;state.fuelExpense='';saveLocal();render()}
function reopenSameDay(){if(isOwner())return;state.turnOpen=true;saveLocal();renderTurno();render()}

function renderAdmin(){const all=summary(state.sales);document.getElementById('view-admin').innerHTML=`<div class="grid3"><div class="card"><h3>Venta total</h3><div class="stat">${clp(all.sales)}</div></div><div class="card"><h3>Costo total</h3><div class="stat">${clp(all.cost)}</div></div><div class="card"><h3>Ganancia total</h3><div class="stat">${clp(all.profit)}</div></div></div><div class="card" style="margin-top:14px"><h3>Por sucursal</h3>${state.branches.map(b=>{const s=summary(branchSales(b.id));return `<div class="item between"><span>${b.name}</span><b>${clp(s.sales)}</b></div>`}).join('')}</div>`}
function exportCSV(){toast('Exportar Excel se activará en la versión Firebase/GitHub')}

loadLocal();initLogin();
window.setDashboardDate=setDashboardDate;window.updateProductPrice=updateProductPrice;window.login=login;window.logout=logout;window.setView=setView;window.setDashboardPeriod=setDashboardPeriod;window.addProductToCart=addProductToCart;window.removeCart=removeCart;window.cancelCart=cancelCart;window.saveSale=saveSale;window.setLibroDate=setLibroDate;window.setRepDate=setRepDate;window.setMonthNav=setMonthNav;window.editSale=editSale;window.deleteSale=deleteSale;window.adjustInventory=adjustInventory;window.saveInvoice=saveInvoice;window.addCategory=addCategory;window.addProductManual=addProductManual;window.addUser=addUser;window.addCourier=addCourier;window.closeShift=closeShift;window.openNewDay=openNewDay;window.reopenSameDay=reopenSameDay;window.exportCSV=exportCSV;
</script>
</body>
</html>
